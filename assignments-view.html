<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raid Assignments — View</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assignments.css">
    <link rel="stylesheet" href="positions.css">
</head>
<body>
    <div class="container">
        <header><h1 id="viewTitle">Raid Assignments</h1></header>
        <div id="viewError" class="warn hidden">Could not read this share link.</div>
        <div class="cards">
            <div class="card"><h3>Boss Debuffs</h3><div id="debuffRows"></div><div id="passiveRows"></div></div>
            <div class="card"><h3>Cooldowns</h3><div id="cooldownRows"></div></div>
            <div class="card"><h3>Healing</h3><div id="healingRows"></div></div>
            <div class="card"><h3>Crowd Control</h3><div id="ccRows"></div></div>
        </div>
        <div id="uncoveredBox" class="warn hidden"></div>
        <div id="posSection" class="hidden">
            <h3>Positioning</h3>
            <div id="posWarnings" class="warn hidden"></div>
            <div id="mapWrap"><img id="mapImg" alt="Positioning map"></div>
        </div>
    </div>
    <script src="assignments-engine.js"></script>
    <script>
    /* global AssignmentsEngine */
    (function () {
        'use strict';
        const E = AssignmentsEngine;
        function row(parent, text, cls) {
            const div = document.createElement('div');
            div.className = 'assign-row' + (cls ? ' ' + cls : '');
            div.textContent = text;
            parent.appendChild(div);
        }
        function target(t) { return t === 'HEALER_RESERVE' ? 'healer in need' : t; }
        // Mark comes from the shared payload, so only ever build a class from a known mark.
        function ccRow(parent, mark, text) {
            const div = document.createElement('div');
            div.className = 'assign-row';
            if (E.MARKS.indexOf(mark) !== -1) {
                const icon = document.createElement('span');
                icon.className = 'rt-icon rt-' + mark;
                div.appendChild(icon);
                div.appendChild(document.createTextNode(' '));
            }
            div.appendChild(document.createTextNode(text));
            parent.appendChild(div);
        }
        // Mirrors markerEl() in positions.js: same DOM shape (.pos-marker/.pos-dot/.pos-label,
        // pos-role-*/pos-kind-* classes, GLYPHS, clump multi-line labels, infernal tag), minus
        // drag wiring and the data-name hook drag needs — the view is always read-only.
        const GLYPHS = { boss: '💀', station: '🔥', clump: '⚔', mt: '🛡', offtank: '🛡', healer: '✚', ranged: '➹', melee: '⚔', tank: '🛡' };
        function viewMarker(m) {
            const el = document.createElement('div');
            el.className = 'pos-marker pos-kind-' + m.kind + (m.role ? ' pos-role-' + m.role : '') + ' static';
            el.style.left = (m.x * 100) + '%';
            el.style.top = (m.y * 100) + '%';
            const dot = document.createElement('div');
            dot.className = 'pos-dot';
            dot.textContent = GLYPHS[m.kind === 'ring' ? m.role : m.kind] || '●';
            el.appendChild(dot);
            const label = document.createElement('div');
            label.className = 'pos-label';
            label.textContent = m.kind === 'clump' ? m.names.join('\n') : (m.name || m.label || '');
            el.appendChild(label);
            if ((m.tags || []).includes('infernal-healer')) {
                const tag = document.createElement('span');
                tag.className = 'pos-tag';
                tag.textContent = '→ infernal station';
                label.appendChild(tag);
            }
            return el;
        }
        function isValidPayload(payload) {
            return !!payload && typeof payload === 'object' &&
                !!payload.sheet && typeof payload.sheet === 'object' &&
                Array.isArray(payload.sheet.duties);
        }
        try {
            const encoded = new URLSearchParams(location.search).get('data');
            if (!encoded) throw new Error('missing data param');
            const payload = JSON.parse(decodeURIComponent(escape(atob(encoded))));
            if (!isValidPayload(payload)) throw new Error('malformed payload');
            if (payload.title) document.getElementById('viewTitle').textContent = 'Raid Assignments — ' + payload.title;
            const sheet = payload.sheet;
            const debuffs = document.getElementById('debuffRows');
            sheet.duties.filter(d => d.category === 'debuffs' && d.player)
                .forEach(d => row(debuffs, d.name + ' — ' + d.player));
            const passives = document.getElementById('passiveRows');
            (sheet.passives || []).forEach(p => row(passives, p.name + ' — auto-covered by ' + p.player, 'passive'));
            const cds = document.getElementById('cooldownRows');
            sheet.duties.filter(d => d.category === 'cooldowns' && d.player)
                .forEach(d => row(cds, d.name + ' — ' + d.player + (d.target ? ' → ' + target(d.target) : '')));
            const healing = document.getElementById('healingRows');
            sheet.duties.filter(d => d.category === 'healing' && d.players && d.players.length)
                .forEach(d => row(healing, d.name + ' — ' + d.players.join(', ')
                    + (d.targets && d.targets.length ? ' → ' + d.targets.join(', ') : '')));
            const cc = document.getElementById('ccRows');
            (sheet.cc || []).filter(c => c.player).forEach(c =>
                ccRow(cc, c.mark, String(c.mark).charAt(0).toUpperCase() + String(c.mark).slice(1) + ' ' +
                    (E.CC_ABILITIES.find(a => a.id === c.ability) || { name: c.ability }).name + ' — ' + c.player));
            const missing = E.missingList(sheet.uncovered);
            if (missing.length) {
                const u = document.getElementById('uncoveredBox');
                u.classList.remove('hidden');
                u.textContent = '⚠ Uncovered: ' + missing.map(x => x.name).join(', ');
            }
            if (payload.positions && Array.isArray(payload.positions.markers)) {
                // Positions are additive on top of the cards above, which have already rendered
                // successfully by this point. A malformed positions sub-payload must not throw
                // into the outer catch and slap an error banner over otherwise-good cards — it
                // should just leave the positioning section hidden.
                try {
                    document.getElementById('posSection').classList.remove('hidden');
                    document.getElementById('mapImg').src = payload.positions.map;
                    const warn = payload.positions.warnings || [];
                    const wbox = document.getElementById('posWarnings');
                    wbox.classList.toggle('hidden', !warn.length);
                    wbox.textContent = warn.join('\n');
                    const wrap = document.getElementById('mapWrap');
                    payload.positions.markers.forEach(m => wrap.appendChild(viewMarker(m)));
                } catch (posErr) {
                    document.getElementById('posSection').classList.add('hidden');
                }
            }
        } catch (e) {
            document.getElementById('viewError').classList.remove('hidden');
        }
    }());
    </script>
</body>
</html>
